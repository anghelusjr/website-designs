<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Inspirations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#E8D5C4;
  --bg:#FAF9F6;
  --accent:#A8B5A2;
  --text:#4A3F35;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

.container{max-width:1200px;margin:auto;padding:80px 20px}

h1{text-align:center;font-size:40px;margin-bottom:10px}
.subtitle{text-align:center;color:#7a6f66;margin-bottom:40px}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #eee;
  position:relative;
  transition:.35s ease;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(74,63,53,0.08);
}

.card img{width:100%;height:200px;object-fit:cover;transition:.4s}
.card:hover img{transform:scale(1.05)}

.card-content{padding:18px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{font-size:14px;color:#7a6f66}

.overlay{
  position:absolute;inset:0;
  background:rgba(74,63,53,0.6);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.3s;
}
.card:hover .overlay{opacity:1}

.overlay a{
  background:var(--primary);
  color:var(--text);
  padding:10px 18px;
  border-radius:999px;
  text-decoration:none;
  font-weight:600;
}

.load-btn{
  display:block;
  margin:40px auto 0;
  padding:12px 20px;
  background:var(--text);
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.hidden{display:none}

.fade{opacity:0;transform:translateY(30px);transition:.7s}
.fade.show{opacity:1;transform:translateY(0)}

footer{text-align:center;padding:40px;color:#8a7f75}
</style>
</head>

<body>

<div class="container">
<h1 class="fade">Website Design Inspirations</h1>
<p class="subtitle fade">Clean, modern websites you can use for clients.</p>

<div id="gallery" class="gallery"></div>

<button id="loadBtn" class="load-btn">Load More</button>

</div>

<footer>
<p>© 2026 WebsiteDesigns.art</p>
</footer>

<script>

// MODEL (3 batches)
const batch1 = [
  {title:"Corporate Website",desc:"Business layout",img:"Business-Corporate-Website.PNG",link:"/apex-1.0.0"},
  {title:"Auto Repair",desc:"Service business",img:"Auto-Repair-Website.PNG",link:"/autorepair-master"},
  {title:"Construction",desc:"Builder website",img:"Construction-Company-Website.PNG",link:"/builerz-master"},
  {title:"Cleaning",desc:"Home services",img:"Cleaning-Services-Website.PNG",link:"/Capiclean-1.0.0"},
  {title:"Cleaning Company",desc:"Commercial cleaning",img:"Cleaning-Company-Website.PNG",link:"/cleaning-company-master"},
  {title:"Construction Business",desc:"Corporate builder",img:"Construction-Business-Website.PNG",link:"/constructioncompany-master"}
];

const batch2 = [
  {title:"Dental Clinic",desc:"Healthcare",img:"DentCare-Dental-Website.PNG",link:"/dentcare-1.0.0"},
  {title:"Dentist",desc:"Medical",img:"Dentist-Website.PNG",link:"/dentista-master"},
  {title:"Garage",desc:"Auto services",img:"Garage-Auto-Service-Website.PNG",link:"/garage"},
  {title:"Handyman",desc:"Repair",img:"Handyman-Services-Website.PNG",link:"/handyman-master"},
  {title:"Health Coach",desc:"Coaching",img:"Health-Coach-Website.PNG",link:"/healthcoach-master"},
  {title:"Home Builder",desc:"Construction",img:"Home-Builder-Website.PNG",link:"/homebuilder-master"}
];

const batch3 = [
  {title:"HVAC",desc:"Air services",img:"HVAC-Services-Website.PNG",link:"/hvac-master"},
  {title:"HVAC Repair",desc:"Maintenance",img:"HVAC-Repair-Website.PNG",link:"/hvac-new-1.0.0"},
  {title:"Landscaping",desc:"Outdoor",img:"Landscaping-Website.PNG",link:"/landscaper-master"},
  {title:"Laundry",desc:"Cleaning",img:"Laundry-Services-Website.PNG",link:"/laundry-master"},
  {title:"Lawn Care",desc:"Outdoor",img:"Lawn-Care-Website.PNG",link:"/lawncare-master"},
  {title:"Medic Care",desc:"Healthcare",img:"Medic-Care.PNG",link:"/medic-care"}
];

let currentBatch = 0;
const batches = [batch1, batch2, batch3];

// VIEW
function createCard(p){
  return `
  <div class="card fade">
    <img src="${p.img}" />
    <div class="overlay"><a href="${p.link}" target="_blank">Preview</a></div>
    <div class="card-content">
      <h3>${p.title}</h3>
      <p>${p.desc}</p>
    </div>
  </div>`;
}

function renderBatch(batch){
  const gallery = document.getElementById('gallery');
  gallery.innerHTML += batch.map(createCard).join('');
}

// CONTROLLER
function init(){
  renderBatch(batches[currentBatch]);

  document.getElementById('loadBtn').addEventListener('click', () => {
    currentBatch++;

    if(currentBatch < batches.length){
      renderBatch(batches[currentBatch]);
      observeFade();
    }

    if(currentBatch === batches.length -1){
      document.getElementById('loadBtn').style.display='none';
    }
  });

  observeFade();
}

function observeFade(){
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('show');}
    })
  });

  document.querySelectorAll('.fade:not(.show)').forEach(el=>observer.observe(el));
}

window.onload = init;

</script>

</body>
</html>
